<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="title desc"><title id="title">Faris and Lala</title><desc id="desc">Four illustrated events in chronological order: A new kite, Torn paper, Repair it, Fly again.</desc><rect width="560" height="520" rx="22" fill="#f1f7f7"/><rect x="14" y="14" width="532" height="492" rx="18" fill="white" stroke="#d7e5e8" stroke-width="2"/><text x="280" y="40" text-anchor="middle" fill="#24344b" font-family="Arial,sans-serif" font-size="20" font-weight="600">Faris and Lala</text><rect x="22" y="60" width="248" height="196" rx="12" fill="#e8f2fc"/><text x="47" y="90" text-anchor="middle" fill="#24344b" font-family="Arial,sans-serif" font-size="22" font-weight="600">1</text><path d="M146 107 L174 145 L146 175 L118 145 Z" fill="#eccb6b" stroke="#456b82" stroke-width="3"/><path d="M146 175 Q171 189 146 204" stroke="#456b82" fill="none"/><text x="146" y="233" text-anchor="middle" fill="#24344b" font-family="Arial,sans-serif" font-size="23" font-weight="600">A new kite</text><rect x="290" y="60" width="248" height="196" rx="12" fill="#e5f3ed"/><text x="315" y="90" text-anchor="middle" fill="#24344b" font-family="Arial,sans-serif" font-size="22" font-weight="600">2</text><path d="M409 109 L385 145 L409 173 L404 149 L412 136 Z M419 109 L443 145 L419 173 L427 149 L419 136 Z" fill="#eccb6b" stroke="#456b82" stroke-width="2"/><text x="414" y="233" text-anchor="middle" fill="#24344b" font-family="Arial,sans-serif" font-size="23" font-weight="600">Torn paper</text><rect x="22" y="270" width="248" height="196" rx="12" fill="#fff1d9"/><text x="47" y="300" text-anchor="middle" fill="#24344b" font-family="Arial,sans-serif" font-size="22" font-weight="600">3</text><rect x="117" y="321" width="40" height="65" fill="white" stroke="#8bb0b8" stroke-width="2"/><rect x="150" y="347" width="30" height="45" rx="5" fill="#bad6ec"/><rect x="156" y="331" width="18" height="17" fill="#e8bb60"/><text x="146" y="443" text-anchor="middle" fill="#24344b" font-family="Arial,sans-serif" font-size="23" font-weight="600">Repair it</text><rect x="290" y="270" width="248" height="196" rx="12" fill="#f7e9f5"/><text x="315" y="300" text-anchor="middle" fill="#24344b" font-family="Arial,sans-serif" font-size="22" font-weight="600">4</text><path d="M414 317 L442 355 L414 385 L386 355 Z" fill="#eccb6b" stroke="#456b82" stroke-width="3"/><path d="M414 385 Q439 399 414 414" stroke="#456b82" fill="none"/><text x="414" y="443" text-anchor="middle" fill="#24344b" font-family="Arial,sans-serif" font-size="23" font-weight="600">Fly again</text><text x="280" y="501" text-anchor="middle" fill="#24344b" font-family="Arial,sans-serif" font-size="19" font-weight="600">Read the story and follow the events.</text></svg>